<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym & Diet Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Pantalla de Bloqueo Anti-Pérdida de Datos -->
    <div id="importOverlay" class="import-overlay" style="display: none;">
        <div class="import-modal">
            <h2>⚠️ Caché Vacía</h2>
            <p>No se detectó historial en este navegador. Sube tu último respaldo para recuperar tus pesos y gráficas.</p>
            <label for="overlayFileImport" class="btn-primary">📂 Subir Respaldo</label>
            <input type="file" id="overlayFileImport" accept=".json" style="display: none;">
            <button id="btnStartFresh" class="btn-text">Iniciar desde cero (Base limpia)</button>
        </div>
    </div>

    <div class="container" id="mainAppContainer" style="display: none;">
        <!-- Navegación por Pestañas -->
        <nav class="tabs">
            <button id="tabWorkout" class="tab-btn active">💪 Entrenamiento</button>
            <button id="tabDiet" class="tab-btn">🥗 Dieta</button>
            <button id="tabProgress" class="tab-btn">📈 Progreso</button>
        </nav>

        <!-- SECCIÓN: ENTRENAMIENTO -->
        <main id="workoutSection" class="tab-content active">
            <header>
                <h1>Mi Rutina</h1>
                <select id="daySelector"></select>
            </header>
            
            <!-- Vista de Días Regulares -->
            <div id="regularDayView">
                <div id="cardioSection" class="cardio-card"></div>
                <div id="exercisesContainer"></div>
            </div>

            <!-- Vista de Fines de Semana (MTB / Descanso) -->
            <div id="weekendView" class="weekend-card" style="display: none;">
                <div class="weekend-header">
                    <h2 id="weekendTitle">Sábado de MTB</h2>
                    <span id="weekendIcon">🚵‍♂️</span>
                </div>
                <div class="weekend-content">
                    <p id="weekendDesc">Recuperación activa y ruta de montaña.</p>
                    <div class="weekend-metrics">
                        <input type="text" id="weekendDistance" placeholder="Distancia (Ej. 30 km)" class="metric-input">
                        <input type="text" id="weekendTime" placeholder="Tiempo (Ej. 2h 15m)" class="metric-input">
                    </div>
                    <button class="btn-primary" id="btnSaveWeekend" style="margin-top: 15px;">Guardar y Respaldar Día</button>
                </div>
            </div>
        </main>

        <!-- SECCIÓN: DIETA -->
        <main id="dietSection" class="tab-content">
            <header>
                <h1>Plan Nutricional</h1>
            </header>
            <div id="nutritionContainer"></div>
        </main>

        <!-- SECCIÓN: PROGRESO -->
        <main id="progressSection" class="tab-content">
            <header>
                <h1>Tendencia de Fuerza</h1>
            </header>
            <div class="chart-container" id="chartContainer">
                <select id="chartExerciseSelector" class="meal-selector" style="display:none;"></select>
                <canvas id="progressChart"></canvas>
                <div id="noDataMessage" class="no-data-msg">Registra pesos en tus ejercicios para ver las gráficas de progreso.</div>
            </div>
        </main>

        <!-- BACKEND LOCAL: Exportar / Importar Manual -->
        <div class="backend-controls">
            <button id="btnExport" class="btn-secondary">💾 Forzar Respaldo</button>
            <label for="fileImport" class="btn-secondary">📂 Importar</label>
            <input type="file" id="fileImport" accept=".json" style="display: none;">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
