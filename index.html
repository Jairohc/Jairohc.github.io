<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Protocolo | Nutrición & Entrenamiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mi Protocolo</h1>
        <p id="fecha-hora"></p>
    </header>

    <main id="main-content">
        <div id="vista-rutina" class="vista">
            <section class="card">
                <h2>🏋️ Entrenamiento del Día</h2>
                <h3 id="nombre-rutina" class="titulo-destacado"></h3>
                <p id="bloque-cardio" class="info-texto"></p>
                <div id="lista-ejercicios"></div>
            </section>
        </div>

        <div id="vista-dieta" class="vista hidden">
            <section class="card">
                <h2>🍽️ Menú del Día</h2>
                <div id="alerta-domingo" class="alerta hidden">
                    ⚠️ Mantenimiento Dominical: Añadir 1 huevo entero o 30% más de carbohidratos base.
                </div>
                
                <div class="tabs-nutricion">
                    <button id="btn-desayuno" onclick="mostrarComida('desayuno')">Desayuno</button>
                    <button id="btn-comida" onclick="mostrarComida('comida')">Comida</button>
                    <button id="btn-cena" onclick="mostrarComida('cena')">Cena</button>
                </div>
                
                <ul id="lista-comidas"></ul>

                <div class="snacks-container">
                    <h3>🍎 Snacks y Extras</h3>
                    <ul id="lista-snacks"></ul>
                </div>
            </section>
        </div>

        <div id="vista-semana" class="vista hidden">
            <section class="card">
                <h2>📅 Resumen Semanal</h2>
                <div id="contenedor-semana"></div>
            </section>
        </div>
    </main>

    <nav class="bottom-nav">
        <button id="nav-rutina" class="nav-item activo" onclick="cambiarVista('rutina')">
            <span class="nav-icon">🏋️</span>
            <span>Rutina</span>
        </button>
        <button id="nav-dieta" class="nav-item" onclick="cambiarVista('dieta')">
            <span class="nav-icon">🍽️</span>
            <span>Dieta</span>
        </button>
        <button id="nav-semana" class="nav-item" onclick="cambiarVista('semana')">
            <span class="nav-icon">📅</span>
            <span>Semana</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
