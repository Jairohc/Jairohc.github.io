<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo | Nutrición & Entrenamiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mi Protocolo</h1>
        <p id="fecha-hora"></p>
    </header>

    <main>
        <div id="vista-hoy">
            
            <section class="card">
                <h2>🍽️ Menú del Día</h2>
                <div id="alerta-domingo" class="alerta hidden">
                    ⚠️ Mantenimiento Dominical: Añadir 1 huevo entero o 30% más de carbohidratos base.
                </div>
                
                <div class="tabs-nutricion">
                    <button id="btn-desayuno" onclick="mostrarComida('desayuno')">Desayuno</button>
                    <button id="btn-comida" onclick="mostrarComida('comida')">Comida</button>
                    <button id="btn-cena" onclick="mostrarComida('cena')">Cena</button>
                </div>
                
                <ul id="lista-comidas"></ul>

                <div class="snacks-container">
                    <h3>🍎 Snacks y Extras</h3>
                    <ul id="lista-snacks"></ul>
                </div>
            </section>

            <section class="card">
                <h2>🏋️ Rutina del Día</h2>
                <h3 id="nombre-rutina"></h3>
                <p id="bloque-cardio" class="info-texto"></p>
                <div id="lista-ejercicios"></div>
            </section>
            
            <button class="btn-primario" onclick="toggleVista()">Ver Plan Semanal Completo 📅</button>
        </div>

        <div id="vista-semana" class="hidden">
            <button class="btn-secundario" onclick="toggleVista()">⬅ Volver a Hoy</button>
            <section class="card">
                <h2>📅 Resumen Semanal de Entrenamiento</h2>
                <div id="contenedor-semana"></div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
