<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Protocolo">
    <title>Protocolo | Nutrición & Entrenamiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mi Protocolo</h1>
        <p id="fecha-hora"></p>
    </header>

    <main id="main-content">
        <div id="vista-rutina" class="vista">
            <div class="card">
                <h2>🏋️ Entrenamiento del Día</h2>
                
                <div class="selector-dia-override">
                    <label for="select-dia">Cambiar rutina:</label>
                    <select id="select-dia" onchange="cambiarDiaRutina(this.value)">
                        <option value="auto">Día Actual (Automático)</option>
                        <option value="1">Lunes: Empuje</option>
                        <option value="2">Martes: Pierna + Abdomen</option>
                        <option value="3">Miércoles: Tirón</option>
                        <option value="4">Jueves: Isquios + Abdomen</option>
                        <option value="5">Viernes: Torso</option>
                        <option value="6">Sábado: MTB</option>
                        <option value="0">Domingo: Ciclismo Rec.</option>
                    </select>
                </div>

                <h3 id="nombre-rutina"></h3>
                <p id="bloque-cardio" class="info-texto"></p>
                <div id="lista-ejercicios"></div>
            </div>
        </div>

        <div id="vista-dieta" class="vista hidden">
            <div class="card">
                <h2>🍽️ Menú del Día</h2>
                <div id="alerta-domingo" class="alerta hidden">
                    ⚠️ Mantenimiento Dominical: Añadir 1 huevo entero o 30% más de carbohidratos base.
                </div>
                <div class="tabs-nutricion">
                    <button id="btn-desayuno" onclick="mostrarComida('desayuno')">Desayuno</button>
                    <button id="btn-comida" onclick="mostrarComida('comida')">Comida</button>
                    <button id="btn-cena" onclick="mostrarComida('cena')">Cena</button>
                </div>
                <ul id="lista-comidas"></ul>
                <div class="snacks-container">
                    <h3>🍎 Snacks y Extras</h3>
                    <ul id="lista-snacks"></ul>
                </div>
            </div>
        </div>

        <div id="vista-semana" class="vista hidden">
            <div class="card">
                <h2>📅 Resumen Semanal</h2>
                <div id="contenedor-semana"></div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button id="nav-rutina" class="nav-item activo" onclick="cambiarVista('rutina')">
            <span class="nav-icon">🏋️</span><span>Rutina</span>
        </button>
        <button id="nav-dieta" class="nav-item" onclick="cambiarVista('dieta')">
            <span class="nav-icon">🍽️</span><span>Dieta</span>
        </button>
        <button id="nav-semana" class="nav-item" onclick="cambiarVista('semana')">
            <span class="nav-icon">📅</span><span>Semana</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
