<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Nutrición & Entrenamiento</title>
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        if (!window.supabase) {
            console.warn("Librería externa bloqueada. Activando modo offline local.");
            window.supabase = {
                createClient: () => ({
                    from: () => ({
                        select: () => ({ eq: () => ({ order: () => ({ limit: () => Promise.resolve({ data: [], error: null }) }) }) }),
                        insert: () => Promise.resolve({ data: null, error: new Error("Modo local activo por bloqueo de red") })
                    })
                })
            };
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
