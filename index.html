<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo | Nutrición & Entrenamiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mi Protocolo</h1>
        <p id="fecha-hora"></p>
    </header>

    <main>
        <div id="vista-hoy">
            <section class="card">
                <h2>🍽️ Plan Nutricional Activo</h2>
                <div id="alerta-domingo" class="alerta hidden">
                    ⚠️ Mantenimiento Dominical: Añadir 1 huevo entero o 30% más de carbohidratos.
                </div>
                <p id="momento-dia" class="badge"></p>
                <ul id="lista-comidas"></ul>
            </section>

            <section class="card">
                <h2>🏋️ Rutina del Día</h2>
                <h3 id="nombre-rutina"></h3>
                <p id="bloque-cardio" class="info-texto"></p>
                <ul id="lista-ejercicios"></ul>
            </section>
            
            <button class="btn-primario" onclick="toggleVista()">Ver Plan Semanal Completo 📅</button>
        </div>

        <div id="vista-semana" class="hidden">
            <button class="btn-secundario" onclick="toggleVista()">⬅ Volver a Hoy</button>
            <section class="card">
                <h2>📅 Resumen Semanal de Entrenamiento</h2>
                <div id="contenedor-semana"></div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
